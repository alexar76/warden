# AppKit target-side gate. Kept out of ci.yml so a macOS runner queue cancel
# does not paint the README CI badge red while Ubuntu test + packaging pass.
name: CI macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-desktop:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Real native AppKit target-side integration gate
        run: npm run test:macos
