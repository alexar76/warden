<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="WARDEN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0c1824"/>
      <stop offset="100%" stop-color="#061016"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#3ecfbf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3ecfbf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bb8a8"/>
      <stop offset="100%" stop-color="#7dd3c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <!-- shield -->
  <path d="M200 52 L314 96 V196 C314 270 264 322 200 350 C136 322 86 270 86 196 V96 Z"
        fill="#0b1c26" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <!-- four gates -->
  <g fill="url(#accent)">
    <rect x="132" y="128" width="20" height="140" rx="6"/>
    <rect x="170" y="128" width="20" height="140" rx="6"/>
    <rect x="208" y="128" width="20" height="140" rx="6"/>
    <rect x="246" y="128" width="20" height="140" rx="6"/>
  </g>
  <!-- the verdict -->
  <circle cx="200" cy="300" r="13" fill="#e0b35a"/>
</svg>
