# pre-commit hooks for MCP client configs. https://pre-commit.com
# They run the published package through npx (Node 20+ on PATH); nothing is built on install.
- id: warden-scan
  name: WARDEN · vet MCP servers in changed configs
  description: Vets every server a changed MCP config starts. Does not start stdio servers; vets their launch lines and fetches remote servers' tools.
  entry: npx --yes @aimarket/warden@0.9.0 scan --no-launch --no-color
  language: system
  files: (^|/)(\.mcp\.json|mcp\.json|claude_desktop_config\.json|mcp_config\.json)$
  pass_filenames: true
  require_serial: true
- id: warden-lock
  name: WARDEN · MCP servers match warden.lock.json
  description: Fails when the project's MCP servers are new, start differently or advertise tools other than the reviewed ones in warden.lock.json. Starts stdio servers, as your MCP client does.
  entry: npx --yes @aimarket/warden@0.9.0 scan --project --lock warden.lock.json --no-color
  language: system
  files: (^|/)(\.mcp\.json|mcp\.json|warden\.lock\.json)$
  pass_filenames: false
  require_serial: true
